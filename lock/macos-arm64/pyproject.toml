# SO-101 macOS arm64 실행 환경 잠금용 가상 프로젝트(패키지가 아님). Linux용 lock/pyproject.toml과 별개다.
# - 이 파일과 같은 폴더의 uv.lock이 설치 기준이다. scripts/install_macos.sh는 `uv sync --locked`만 실행하며 재해결하지 않는다.
# - 다시 해결(relock)하는 경우는 `scripts/install_macos.sh --relock`(유지보수용)뿐이다.
#
# Linux와의 차이:
#   - torch/torchvision을 PyPI에서 받는다. macOS 빌드에는 CUDA 변형이 없어 +cpu 로컬 태그가 없고,
#     download.pytorch.org/whl/cpu의 macOS 휠은 PyPI와 sha256이 다르다(공식 lerobot uv.lock도 darwin은 PyPI).
#   - 데이터셋 생성(lerobot-record·LeRobotDataset)을 위해 공식 extra `dataset`을 포함한다
#     (datasets, pandas, pyarrow, av, jsonlines, torchcodec[darwin arm64 marker]).
#     torchcodec은 별도 FFmpeg가 없으면 로드되지 않으며, 공식 코드(get_safe_default_video_backend)가 pyav로 대체한다.
#   - pynput(`hardware` extra)은 넣지 않는다. 녹화 키 입력은 공식 TerminalKeyListener(n/r/q)를 쓴다.
#
# LeRobot 설치 방식은 Linux와 같다: PyPI lerobot 0.6.1 휠(해시 고정) + external/lerobot(고정 SHA)과 바이트 비교(doctor).
[project]
name = "so101-env-macos"
version = "0.0.0"
description = "Pinned macOS arm64 runtime for SO-101 setup, teleoperation and local dataset recording with official LeRobot"
requires-python = "==3.12.*"
dependencies = [
    "lerobot[feetech,dataset]==0.6.1",
    # lerobot core 의존성이다. 버전 범위는 lerobot이 정한다(Linux lock과 같은 이유로 이름만 명시).
    "torch",
    "torchvision",
    # ACT 추론 Core ML backend(선택형, scripts/so101_act_coreml.py·tools/act_coreml_export.py). macOS 전용.
    # 같은 가중치를 Core ML GPU FP32로 실행한다. 9.0은 torch 2.7까지 시험됐다는 경고가 있어 변환은 export 도구에서 한 번만 하고,
    # 실행 중에는 컴파일본만 로드한다(docs/ACT_INFERENCE_OPTIMIZATION_PLAN.md 5절, 2026-10-17 사용자 승인).
    "coremltools==9.0",
]

[tool.uv]
package = false
# 이 lock은 macOS arm64만 대상으로 한다.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
# 휠이 없는 패키지는 feetech-servo-sdk 1.0.0(sdist, legacy setup.py)뿐이어야 한다(relock 시 검사).
build-constraint-dependencies = ["setuptools==81.0.0"]
# 공식 uv.lock과 같은 버전이 선택되도록 Linux lock과 같은 기준 시각을 쓴다(고정 커밋 시각 2026-08-03T14:05:01Z).
exclude-newer = "2026-08-03T14:05:01Z"
exclude-newer-package = { lerobot = "2026-08-03T14:30:00Z" }
# 공식 uv.lock은 datasets 상한 때문에 fsspec 2026.2.0을 잠갔다. 같은 버전으로 맞춘다.
# coremltools가 끌어오는 protobuf는 공식 uv.lock과 같은 버전(6.32.0)으로 맞춘다(공통 패키지 해시 비교 대상이 되도록).
constraint-dependencies = ["fsspec==2026.2.0", "protobuf==6.32.0"]
